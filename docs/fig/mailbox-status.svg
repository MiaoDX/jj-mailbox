<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="720" height="590"
     viewBox="0 0 720 590">

  <!-- Drop shadow -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Window frame -->
  <rect x="0" y="0" width="720" height="590"
        rx="10" ry="10"
        fill="#1e1e2e" filter="url(#shadow)" />

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="38"
        rx="10" ry="10" fill="#313244" />
  <rect x="0" y="19" width="720" height="19"
        fill="#313244" />

  <!-- Traffic lights -->
  <circle cx="20" cy="19" r="6" fill="#ff5f57" />
<circle cx="40" cy="19" r="6" fill="#febc2e" />
<circle cx="60" cy="19" r="6" fill="#28c840" />

  <!-- Title text -->
  <text x="360" y="24"
        font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13"
        fill="#a6adc8" text-anchor="middle">miaodx@jj-mailbox: ~</text>

  <!-- Terminal content -->
  <text x="20" y="70" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#89b4fa">$ </tspan><tspan fill="#cdd6f4">jj-mailbox status</tspan></text>
    <text x="20" y="110" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#b4befe">Agent Status:</tspan></text>
    <text x="20" y="130" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">🟢 </tspan><tspan fill="#b4befe">alice</tspan><tspan fill="#cdd6f4">  (</tspan><tspan fill="#a6e3a1">online</tspan><tspan fill="#cdd6f4">)  📬 0 msg  🕐 2026-03-12T09:36:19Z</tspan></text>
    <text x="20" y="150" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">🟢 </tspan><tspan fill="#b4befe">bob</tspan><tspan fill="#cdd6f4">  (</tspan><tspan fill="#a6e3a1">online</tspan><tspan fill="#cdd6f4">)  📬 1 msg  🕐 2026-03-12T09:36:20Z</tspan></text>
    <text x="20" y="170" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">🟢 </tspan><tspan fill="#b4befe">carol</tspan><tspan fill="#cdd6f4">  (</tspan><tspan fill="#a6e3a1">online</tspan><tspan fill="#cdd6f4">)  📬 0 msg  🕐 2026-03-12T09:36:20Z</tspan></text>
    <text x="20" y="210" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#89b4fa">$ </tspan><tspan fill="#cdd6f4">jj-mailbox inbox --agent bob</tspan></text>
    <text x="20" y="250" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">1 message(s) for </tspan><tspan fill="#b4befe">bob</tspan><tspan fill="#cdd6f4">:</tspan></text>
    <text x="20" y="270" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">From: </tspan><tspan fill="#b4befe">alice</tspan><tspan fill="#cdd6f4">  Subject: Research done  Time: 2026-03-12T09:36:20Z</tspan></text>
    <text x="20" y="310" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#89b4fa">$ </tspan><tspan fill="#cdd6f4">jj-mailbox read --agent bob</tspan></text>
    <text x="20" y="350" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">{</tspan></text>
    <text x="20" y="370" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"version"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"0.1"</tspan><tspan fill="#cdd6f4">,</tspan></text>
    <text x="20" y="390" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"id"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"msg-361bc237"</tspan><tspan fill="#cdd6f4">,</tspan></text>
    <text x="20" y="410" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"timestamp"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"2026-03-12T09:36:20Z"</tspan><tspan fill="#cdd6f4">,</tspan></text>
    <text x="20" y="430" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"from"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"alice"</tspan><tspan fill="#cdd6f4">,</tspan></text>
    <text x="20" y="450" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"to"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"bob"</tspan><tspan fill="#cdd6f4">,</tspan></text>
    <text x="20" y="470" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"type"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"message"</tspan><tspan fill="#cdd6f4">,</tspan></text>
    <text x="20" y="490" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"subject"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"Research done"</tspan><tspan fill="#cdd6f4">,</tspan></text>
    <text x="20" y="510" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"body"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"Found 3 caching strategies. Recommend LRU with TTL."</tspan><tspan fill="#cdd6f4">,</tspan></text>
    <text x="20" y="530" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"refs"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#94e2d5">[]</tspan><tspan fill="#cdd6f4">,</tspan></text>
    <text x="20" y="550" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#94e2d5">"metadata"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#cdd6f4">{}</tspan></text>
    <text x="20" y="570" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">}</tspan></text>

</svg>
