<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="720" height="690"
     viewBox="0 0 720 690">

  <!-- Drop shadow -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Window frame -->
  <rect x="0" y="0" width="720" height="690"
        rx="10" ry="10"
        fill="#1e1e2e" filter="url(#shadow)" />

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="38"
        rx="10" ry="10" fill="#313244" />
  <rect x="0" y="19" width="720" height="19"
        fill="#313244" />

  <!-- Traffic lights -->
  <circle cx="20" cy="19" r="6" fill="#ff5f57" />
<circle cx="40" cy="19" r="6" fill="#febc2e" />
<circle cx="60" cy="19" r="6" fill="#28c840" />

  <!-- Title text -->
  <text x="360" y="24"
        font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13"
        fill="#a6adc8" text-anchor="middle">miaodx@jj-mailbox: ~</text>

  <!-- Terminal content -->
  <text x="20" y="70" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#89b4fa">$ </tspan><tspan fill="#cdd6f4">uv run python tests/run_all.py --no-llm</tspan></text>
    <text x="20" y="110" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#b4befe">=== Core CLI Tests ===</tspan></text>
    <text x="20" y="130" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- init</tspan></text>
    <text x="20" y="150" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="170" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- register alice</tspan></text>
    <text x="20" y="190" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="210" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- register bob</tspan></text>
    <text x="20" y="230" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="250" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- send</tspan></text>
    <text x="20" y="270" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="290" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- inbox</tspan></text>
    <text x="20" y="310" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="330" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- read</tspan></text>
    <text x="20" y="350" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="370" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- reply</tspan></text>
    <text x="20" y="390" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="410" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- status</tspan></text>
    <text x="20" y="430" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="470" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#b4befe">=== Scripted Agent Test ===</tspan></text>
    <text x="20" y="490" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- scripted/test.py</tspan></text>
    <text x="20" y="510" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="550" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#b4befe">=== Comparison Benchmark ===</tspan></text>
    <text x="20" y="570" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#a6adc8">--- comparison/benchmark.py</tspan></text>
    <text x="20" y="590" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1">PASS</tspan></text>
    <text x="20" y="630" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#b4befe">===============================</tspan></text>
    <text x="20" y="650" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">  PASS: </tspan><tspan fill="#f9e2af">10</tspan><tspan fill="#cdd6f4">  FAIL: </tspan><tspan fill="#f9e2af">0</tspan><tspan fill="#cdd6f4"></tspan></text>
    <text x="20" y="670" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#b4befe">===============================</tspan></text>

</svg>
