name: CI - Comparison Benchmark

on:
  workflow_dispatch: {}
  schedule:
    # Weekly on Monday 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  comparison-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.28.2/jj-v0.28.2-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin/ ./jj
          jj version

      - name: Configure git & jj
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@jj-mailbox.test"
          mkdir -p ~/.config/jj
          echo -e '[user]\nname = "CI"\nemail = "ci@jj-mailbox.test"' > ~/.config/jj/config.toml

      - name: Make CLI executable
        run: chmod +x bin/jj-mailbox

      - name: Run comparison benchmark
        run: python3 tests/comparison/benchmark.py

      - name: Upload COMPARISON.md
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report
          path: tests/comparison/COMPARISON.md

      - name: Post to GitHub Step Summary
        run: |
          echo "## Slack-style vs jj-mailbox Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat tests/comparison/COMPARISON.md >> $GITHUB_STEP_SUMMARY
