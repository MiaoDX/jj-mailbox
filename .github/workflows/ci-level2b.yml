name: CI - Level 2b smolagents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smolagents-test:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.28.2/jj-v0.28.2-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin/ ./jj
          jj version

      - name: Configure git & jj
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@jj-mailbox.test"
          mkdir -p ~/.config/jj
          echo -e '[user]\nname = "CI"\nemail = "ci@jj-mailbox.test"' > ~/.config/jj/config.toml

      - name: Make CLI executable
        run: chmod +x bin/jj-mailbox

      - name: Check if HF_TOKEN is set
        id: check_token
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⏭ HF_TOKEN not set — skipping Level 2b smolagents test"
          fi

      - name: Install smolagents
        if: steps.check_token.outputs.has_token == 'true'
        run: pip install -r tests/level2b-smolagents/requirements.txt

      - name: Run Level 2b - smolagents
        run: python3 tests/level2b-smolagents/test.py

      - name: Summary
        if: always()
        run: |
          echo "## Level 2b: smolagents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_token.outputs.has_token }}" = "true" ]; then
            echo "- HF_TOKEN present: test ran with Qwen/Qwen2.5-0.5B-Instruct" >> $GITHUB_STEP_SUMMARY
          else
            echo "- HF_TOKEN absent: test skipped (add HF_TOKEN secret to enable)" >> $GITHUB_STEP_SUMMARY
          fi
