name: CI - smolagents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smolagents-test:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE: https://openrouter.ai/api/v1
      LLM_MODEL: openrouter/auto
    steps:
      - uses: actions/checkout@v4

      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.28.2/jj-v0.28.2-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin/ ./jj
          jj version

      - name: Configure git & jj
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@jj-mailbox.test"
          mkdir -p ~/.config/jj
          echo -e '[user]\nname = "CI"\nemail = "ci@jj-mailbox.test"' > ~/.config/jj/config.toml

      - name: Make CLI executable
        run: chmod +x bin/jj-mailbox

      - name: Check if LLM_API_KEY is set
        id: check_key
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "LLM_API_KEY not set — skipping smolagents test"
          fi

      - name: Install smolagents
        if: steps.check_key.outputs.has_key == 'true'
        run: pip install -r tests/smolagents/requirements.txt

      - name: Run smolagents test
        run: python3 tests/smolagents/test.py

      - name: Summary
        if: always()
        run: |
          echo "## smolagents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_key.outputs.has_key }}" = "true" ]; then
            echo "- Model: \`$LLM_MODEL\` @ $LLM_API_BASE" >> $GITHUB_STEP_SUMMARY
          else
            echo "- LLM_API_KEY absent: test skipped (add secret to enable)" >> $GITHUB_STEP_SUMMARY
          fi
