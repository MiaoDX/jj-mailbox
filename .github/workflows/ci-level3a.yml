name: CI - Level 3a Free LLM Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  free-llm-agent:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE: https://openrouter.ai/api/v1
      LLM_MODEL: xiaomi/mimo-v2-flash:free
    steps:
      - uses: actions/checkout@v4

      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.28.2/jj-v0.28.2-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin/ ./jj
          jj version

      - name: Configure git & jj
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@jj-mailbox.test"
          mkdir -p ~/.config/jj
          echo -e '[user]\nname = "CI"\nemail = "ci@jj-mailbox.test"' > ~/.config/jj/config.toml

      - name: Make CLI executable
        run: chmod +x bin/jj-mailbox

      - name: Check if LLM_API_KEY is set
        id: check_key
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "⏭ LLM_API_KEY not set — skipping Level 3a test"
          fi

      - name: Install openai
        if: steps.check_key.outputs.has_key == 'true'
        run: pip install openai

      - name: Run Level 3a - Tool-calling LLM agent
        run: python3 tests/level3a-llm-free/test.py

      - name: Upload conversation log
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: level3a-conversation-log
          path: /tmp/jj-mailbox-3a-*/shared/artifacts/conversation.json
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Level 3a: Free LLM Tool-Calling Agent" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_key.outputs.has_key }}" = "true" ]; then
            echo "- Model: \`$LLM_MODEL\`" >> $GITHUB_STEP_SUMMARY
            echo "- API: $LLM_API_BASE" >> $GITHUB_STEP_SUMMARY
            echo "- Scenario: 3-round code review with tool calls" >> $GITHUB_STEP_SUMMARY
          else
            echo "- LLM_API_KEY absent: test skipped (add LLM_API_KEY secret to enable)" >> $GITHUB_STEP_SUMMARY
          fi
