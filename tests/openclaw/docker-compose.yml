# Five OpenClaw agents communicating via jj-mailbox
#
# All agents share a single jj repo volume — messages are visible immediately.
# Tests: OpenClaw → skill → jj-mailbox CLI → filesystem.
#
# Usage:
#   ./test.sh --no-llm     # CLI-only, 30 messages, 5 agents
#   ./test.sh --llm-smoke  # 1 real OpenClaw agent turn + verify receipt
#   ./test.sh              # full LLM test (needs LLM_API_KEY)

# env_file provides LLM_API_KEY from .env.
# Do NOT re-declare LLM_API_KEY in environment: — it shadows env_file with
# the host's (possibly empty) value via ${LLM_API_KEY:-}.

x-agent-common: &agent-common
  build:
    context: ../..
    dockerfile: tests/openclaw/Dockerfile
    network: host
  init: true
  env_file: ../../.env
  volumes:
    - mailbox-data:/mailbox

services:
  alice:
    <<: *agent-common
    container_name: openclaw-alice
    hostname: alice
    environment:
      - JJ_MAILBOX_AGENT=alice
      - JJ_MAILBOX_REPO=/mailbox
    command:
      - sh
      - -c
      - |
        # OpenClaw auth setup (uses LLM_API_KEY from env_file)
        if [ -n "$$LLM_API_KEY" ]; then
          openclaw onboard --non-interactive --accept-risk \
            --mode local --workspace /mailbox \
            --auth-choice openrouter-api-key --openrouter-api-key "$$LLM_API_KEY" \
            --skip-channels --skip-daemon --skip-health --skip-search --skip-skills --skip-ui \
            2>/dev/null || true;
        fi;
        openclaw models set openrouter/openrouter/free 2>/dev/null || true;
        cd /mailbox;
        if [ ! -d .jj ]; then jj git init --colocate; fi;
        jj-mailbox register alice 'Research specialist';
        echo '=== Alice online ===';
        tail -f /dev/null

  bob:
    <<: *agent-common
    container_name: openclaw-bob
    hostname: bob
    depends_on:
      - alice
    environment:
      - JJ_MAILBOX_AGENT=bob
      - JJ_MAILBOX_REPO=/mailbox
    command:
      - sh
      - -c
      - |
        if [ -n "$$LLM_API_KEY" ]; then
          openclaw onboard --non-interactive --accept-risk \
            --mode local --workspace /mailbox \
            --auth-choice openrouter-api-key --openrouter-api-key "$$LLM_API_KEY" \
            --skip-channels --skip-daemon --skip-health --skip-search --skip-skills --skip-ui \
            2>/dev/null || true;
        fi;
        openclaw models set openrouter/openrouter/free 2>/dev/null || true;
        until [ -d /mailbox/.jj ]; do sleep 1; done;
        sleep 2;
        jj-mailbox register bob 'Code review specialist';
        echo '=== Bob online ===';
        tail -f /dev/null

  carol:
    <<: *agent-common
    container_name: openclaw-carol
    hostname: carol
    depends_on:
      - alice
    environment:
      - JJ_MAILBOX_AGENT=carol
      - JJ_MAILBOX_REPO=/mailbox
    command:
      - sh
      - -c
      - |
        if [ -n "$$LLM_API_KEY" ]; then
          openclaw onboard --non-interactive --accept-risk \
            --mode local --workspace /mailbox \
            --auth-choice openrouter-api-key --openrouter-api-key "$$LLM_API_KEY" \
            --skip-channels --skip-daemon --skip-health --skip-search --skip-skills --skip-ui \
            2>/dev/null || true;
        fi;
        openclaw models set openrouter/openrouter/free 2>/dev/null || true;
        until [ -d /mailbox/.jj ]; do sleep 1; done;
        sleep 4;
        jj-mailbox register carol 'Testing engineer';
        echo '=== Carol online ===';
        tail -f /dev/null

  dave:
    <<: *agent-common
    container_name: openclaw-dave
    hostname: dave
    depends_on:
      - alice
    environment:
      - JJ_MAILBOX_AGENT=dave
      - JJ_MAILBOX_REPO=/mailbox
    command:
      - sh
      - -c
      - |
        if [ -n "$$LLM_API_KEY" ]; then
          openclaw onboard --non-interactive --accept-risk \
            --mode local --workspace /mailbox \
            --auth-choice openrouter-api-key --openrouter-api-key "$$LLM_API_KEY" \
            --skip-channels --skip-daemon --skip-health --skip-search --skip-skills --skip-ui \
            2>/dev/null || true;
        fi;
        openclaw models set openrouter/openrouter/free 2>/dev/null || true;
        until [ -d /mailbox/.jj ]; do sleep 1; done;
        sleep 6;
        jj-mailbox register dave 'DevOps engineer';
        echo '=== Dave online ===';
        tail -f /dev/null

  eve:
    <<: *agent-common
    container_name: openclaw-eve
    hostname: eve
    depends_on:
      - alice
    environment:
      - JJ_MAILBOX_AGENT=eve
      - JJ_MAILBOX_REPO=/mailbox
    command:
      - sh
      - -c
      - |
        if [ -n "$$LLM_API_KEY" ]; then
          openclaw onboard --non-interactive --accept-risk \
            --mode local --workspace /mailbox \
            --auth-choice openrouter-api-key --openrouter-api-key "$$LLM_API_KEY" \
            --skip-channels --skip-daemon --skip-health --skip-search --skip-skills --skip-ui \
            2>/dev/null || true;
        fi;
        openclaw models set openrouter/openrouter/free 2>/dev/null || true;
        until [ -d /mailbox/.jj ]; do sleep 1; done;
        sleep 8;
        jj-mailbox register eve 'Security analyst';
        echo '=== Eve online ===';
        tail -f /dev/null

volumes:
  mailbox-data:
