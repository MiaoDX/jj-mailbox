# Two raw OpenClaw agents communicating via jj-mailbox
#
# Both agents share the same jj repo volume — messages are visible immediately.
# This tests the OpenClaw → skill → jj-mailbox CLI → filesystem path.
#
# Usage:
#   ./test.sh           # full test with LLM
#   ./test.sh --no-llm  # CLI-only test, no API key needed
#
#   # Or manually:
#   docker compose up -d
#   docker compose exec alice openclaw agent --local -m "Send bob a message about caching design"
#   docker compose exec bob openclaw agent --local -m "Read your inbox and reply"

services:
  alice:
    build:
      context: ../..
      dockerfile: tests/openclaw/Dockerfile
      network: host
    container_name: openclaw-alice
    hostname: alice
    init: true
    env_file: ../../.env
    environment:
      - JJ_MAILBOX_AGENT=alice
      - JJ_MAILBOX_REPO=/mailbox
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENAI_API_KEY=${LLM_API_KEY:-}
      - OPENAI_BASE_URL=${LLM_API_BASE:-https://openrouter.ai/api/v1}
      - OPENCLAW_MODEL=${LLM_MODEL:-openrouter/free}
    volumes:
      - mailbox-data:/mailbox
    command: >
      sh -c "
        openclaw setup --non-interactive --mode local --workspace /mailbox 2>/dev/null || true;
        openclaw models set openrouter/openrouter/free 2>/dev/null || true;
        cd /mailbox;
        if [ ! -d .jj ]; then
          jj git init --colocate;
          jj-mailbox register alice 'Research specialist';
        fi;
        echo '=== Alice (OpenClaw) online ===';
        tail -f /dev/null
      "

  bob:
    build:
      context: ../..
      dockerfile: tests/openclaw/Dockerfile
      network: host
    container_name: openclaw-bob
    hostname: bob
    init: true
    env_file: ../../.env
    environment:
      - JJ_MAILBOX_AGENT=bob
      - JJ_MAILBOX_REPO=/mailbox
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENAI_API_KEY=${LLM_API_KEY:-}
      - OPENAI_BASE_URL=${LLM_API_BASE:-https://openrouter.ai/api/v1}
      - OPENCLAW_MODEL=${LLM_MODEL:-openrouter/free}
    volumes:
      - mailbox-data:/mailbox
    depends_on:
      - alice
    command: >
      sh -c "
        sleep 3;
        openclaw setup --non-interactive --mode local --workspace /mailbox 2>/dev/null || true;
        openclaw models set openrouter/openrouter/free 2>/dev/null || true;
        cd /mailbox;
        if [ ! -d agents/bob ]; then
          jj-mailbox register bob 'Code review specialist';
        fi;
        echo '=== Bob (OpenClaw) online ===';
        tail -f /dev/null
      "

volumes:
  mailbox-data:
